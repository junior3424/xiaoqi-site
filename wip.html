<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>施工中 — 小七</title>
<meta name="description" content="这一页还在施工。没做完的东西不上站。">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E3EBE7">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E3EBE7'/%3E%3Crect x='6' y='6' width='14' height='14' fill='%2312241F'/%3E%3Ccircle cx='23' cy='21' r='5' fill='%23F07A5E'/%3E%3C/svg%3E">
<script>document.documentElement.classList.replace('no-js','js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wip-wrap{
    min-height:100svh;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(28px,7vw,96px) var(--pad);
    max-width:var(--max); margin:0 auto;
  }
  .wip-mark{ display:flex; align-items:center; gap:12px; margin-bottom:clamp(20px,4vw,40px); }
  .wip-mark__sq{ width:22px; height:22px; background:var(--ink); }
  .wip-mark__bar{ width:88px; height:10px; background:var(--sage); }
  .wip-eyebrow{
    font-family:var(--f-mono); font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted); margin:0 0 14px;
  }
  .wip-title{
    font-family:var(--f-display); font-weight:800;
    font-size:clamp(2.4rem,9vw,6rem); line-height:.98; letter-spacing:-.02em;
    margin:0; color:var(--ink);
  }
  .wip-title em{ font-style:normal; color:#DE5C3D; }  /* 大字对比度 3.03:1（--coral 只有 2.26） */
  .wip-lede{
    max-width:46ch; margin:clamp(20px,3vw,32px) 0 0;
    font-size:clamp(15px,1.6vw,18px); line-height:1.65; color:var(--ink-80);
  }
  .wip-rule{ height:1px; background:var(--line); margin:clamp(28px,4vw,44px) 0 clamp(20px,3vw,28px); }
  .wip-actions{ display:flex; flex-wrap:wrap; gap:12px; }
  .wip-foot{
    margin-top:clamp(36px,6vw,72px);
    font-family:var(--f-mono); font-size:11px; letter-spacing:.12em;
    color:var(--muted);
  }
  .wip-foot a{ color:var(--muted); text-decoration:underline; text-underline-offset:4px; }
  /* 覆盖 style.css 里 left:-9999px 的 skip：那会造成左侧溢出 */
  .skip{ left:0; top:0; transform:translateY(-130%); }
  .skip:focus{ transform:none; }
  /* 页脚邮箱：补足 44px 可点高度 */
  .wip-foot a{ display:inline-flex; align-items:center; min-height:44px; }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<main class="wip-wrap" id="main">
  <div class="wip-mark" aria-hidden="true">
    <span class="wip-mark__sq"></span>
    <span class="wip-mark__bar"></span>
  </div>

  <p class="wip-eyebrow">WIP · 施工中</p>
  <h1 class="wip-title">这页还在<em>施工</em></h1>

  <p class="wip-lede">
    这一页还在施工，请耐心等待。
  </p>

  <div class="wip-rule"></div>

  <div class="wip-actions">
    <a class="btn btn--solid" href="index.html">回首页 <span aria-hidden="true">↗</span></a>
    <a class="btn btn--ghost" href="index.html#work">看已经做完的 <span aria-hidden="true">↓</span></a>
  </div>

  <p class="wip-foot">小七 · <a href="mailto:xiaoqiin@outlook.com">xiaoqiin@outlook.com</a></p>
</main>
</body>
</html>
