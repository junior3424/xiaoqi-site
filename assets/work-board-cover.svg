<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="任务看板封面：四项统计、一条搜索框、三行任务">
  <style>
    .paper   { fill:#D2DFDA; }
    .card    { fill:#E3EBE7; }
    .ink     { fill:#12241F; }
    .coral   { fill:#F07A5E; }
    .teal    { fill:#1F6F63; }
    .sage    { fill:#AFC6BE; }
    .rule    { stroke:#12241F; stroke-width:2; fill:none; }
    .hair    { stroke:#12241F; stroke-width:1; fill:none; opacity:.22; }
    .num     { font-family:"Helvetica Neue",Arial,sans-serif; font-weight:700; font-size:62px; fill:#12241F; letter-spacing:-.02em; }
    .lab     { font-family:"Courier New",monospace; font-size:12px; letter-spacing:.18em; fill:#12241F; opacity:.62; }
    .tiny    { font-family:"Courier New",monospace; font-size:11px; letter-spacing:.16em; fill:#12241F; opacity:.5; }
  </style>

  <rect class="paper" width="800" height="600"/>

  <!-- 顶栏：方块 + 一条承重线 -->
  <rect class="ink" x="56" y="42" width="22" height="22"/>
  <rect class="sage" x="82" y="52" width="86" height="10"/>
  <line class="rule" x1="56" y1="88" x2="744" y2="88"/>

  <!-- 四项统计 -->
  <g>
    <text class="num" x="56" y="182">04</text>
    <text class="lab" x="56" y="208">OPEN</text>

    <text class="num" x="232" y="182">16</text>
    <text class="lab" x="232" y="208">DONE</text>

    <text class="num" x="408" y="182">00</text>
    <text class="lab" x="408" y="208">DROPPED</text>

    <text class="num" x="584" y="182">20</text>
    <text class="lab" x="584" y="208">TOTAL</text>

    <line class="hair" x1="208" y1="124" x2="208" y2="216"/>
    <line class="hair" x1="384" y1="124" x2="384" y2="216"/>
    <line class="hair" x1="560" y1="124" x2="560" y2="216"/>
  </g>

  <!-- 搜索框 + 两枚筛选 -->
  <rect class="card" x="56" y="252" width="464" height="56" stroke="#12241F" stroke-width="2"/>
  <rect class="sage" x="80" y="272" width="150" height="8"/>
  <rect class="coral" x="246" y="268" width="10" height="18"/>
  <rect class="ink" x="492" y="268" width="10" height="18" opacity=".25"/>

  <rect class="card" x="544" y="252" width="88" height="56" stroke="#12241F" stroke-width="2"/>
  <rect class="coral" x="564" y="274" width="8" height="12"/>
  <rect class="ink" x="584" y="276" width="28" height="8" opacity=".55"/>

  <rect class="ink" x="648" y="252" width="96" height="56"/>
  <rect class="coral" x="668" y="274" width="8" height="12"/>
  <rect class="card" x="688" y="276" width="34" height="8"/>

  <!-- 右侧窄栏：最近动态，让画面右半边不空 -->
  <rect class="sage" x="620" y="352" width="124" height="34" opacity=".55"/>
  <rect class="ink" x="632" y="364" width="7" height="7"/>
  <rect class="teal" x="620" y="398" width="124" height="34" opacity=".85"/>
  <rect class="card" x="632" y="410" width="7" height="7"/>
  <rect class="sage" x="620" y="444" width="124" height="34" opacity=".55"/>
  <rect class="ink" x="632" y="456" width="7" height="7"/>
  <rect class="sage" x="620" y="490" width="124" height="26" opacity=".35"/>
  <rect class="ink" x="632" y="500" width="7" height="6"/>

  <!-- 三行任务：长度递减 / 交错，右下角一行用珊瑚标记卡住的那件 -->
  <rect class="sage" x="56" y="352" width="520" height="44"/>
  <rect class="teal" x="56" y="412" width="430" height="44"/>
  <rect class="sage" x="56" y="472" width="300" height="44"/>
  <rect class="ink" x="72" y="370" width="8" height="8"/>
  <rect class="ink" x="72" y="430" width="8" height="8"/>
  <rect class="coral" x="72" y="490" width="8" height="8"/>

  <!-- 第三行尾巴上的珊瑚端头：这一件卡住了 -->
  <rect class="coral" x="356" y="472" width="18" height="44"/>

  <!-- 底部：一条细线与页码感 -->
  <line class="hair" x1="56" y1="548" x2="744" y2="548"/>
  <text class="tiny" x="56" y="572">READ ONLY · 2026</text>
  <text class="tiny" x="700" y="572">01</text>
</svg>
